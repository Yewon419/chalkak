name: Chalkak
description: >-
  Screenshot a built iOS simulator .app screen by screen using launch arguments, and upload the shots
  with a browsable gallery. No UI test target, no app source changes. macOS runners only.
author: Yewon419
branding:
  icon: camera
  color: orange

inputs:
  app:
    description: Path to the simulator .app (e.g. build/dd/Build/Products/Debug-iphonesimulator/MyApp.app)
    required: true
  screens:
    description: 'One screen per line: "<name> | <launch arguments>". Arguments may be omitted. Lines starting with # are comments.'
    required: true
  defaults:
    description: 'UserDefaults to inject before first launch, one per line: "<key> -bool true" (defaults write argument form)'
    required: false
    default: ''
  appearance:
    description: light | dark | light,dark
    required: false
    default: light
  device:
    description: Substring of a device name (e.g. "iPhone 17 Pro"). Empty picks the first iPhone on the newest iOS runtime.
    required: false
    default: ''
  runtime:
    description: Runtime filter (e.g. "iOS 26"). Empty picks the newest.
    required: false
    default: ''
  wait:
    description: Seconds to wait between launch and capture
    required: false
    default: '5'
  output-dir:
    description: Directory the screenshots are written to
    required: false
    default: screenshots
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: screenshots
  upload:
    description: Whether to upload the artifact
    required: false
    default: 'true'
  fail-on-crash:
    description: Fail the step if the app was not running at capture time
    required: false
    default: 'true'
  bundle-id:
    description: Bundle identifier. Empty reads CFBundleIdentifier from Info.plist.
    required: false
    default: ''
  title:
    description: Gallery (index.html) title. Empty uses "<executable> 찰칵".
    required: false
    default: ''
  privacy:
    description: >-
      Permissions to pre-grant after install (comma separated, simctl privacy service names: location, photos,
      contacts, calendar, reminders, microphone, motion, media-library, siri, all). A system permission alert stays
      on screen across relaunches and covers every later shot.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Chalkak capture
      shell: bash
      env:
        APP: ${{ inputs.app }}
        SCREENS: ${{ inputs.screens }}
        DEFAULTS: ${{ inputs.defaults }}
        APPEARANCE: ${{ inputs.appearance }}
        DEVICE: ${{ inputs.device }}
        RUNTIME: ${{ inputs.runtime }}
        WAIT: ${{ inputs.wait }}
        OUT: ${{ inputs.output-dir }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
        TITLE: ${{ inputs.title }}
        PRIVACY: ${{ inputs.privacy }}
        FAIL_ON_CRASH: ${{ inputs.fail-on-crash }}
        SHUTDOWN: 'false'
      run: bash "${GITHUB_ACTION_PATH}/scripts/shoot.sh"
    - name: Chalkak artifact upload
      if: ${{ always() && inputs.upload == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: warn
